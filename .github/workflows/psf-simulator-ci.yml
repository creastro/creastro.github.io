name: PSF simulator CI

on:
  pull_request:
    paths:
      - 'psf-simulator/**'
      - 'simulations/telescope-psf/**'
      - 'simulations/shared/**'
      - '.github/workflows/psf-simulator-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'psf-simulator/**'
      - 'simulations/telescope-psf/**'
      - 'simulations/shared/**'
      - '.github/workflows/psf-simulator-ci.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: psf-simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: psf-simulator/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Type-checks, then regenerates simulations/telescope-psf/telescope-psf.js and psf-worker.js from src/.
      - name: Build
        run: npm run build

      # The generated scripts are committed, so they must match what the sources produce.
      - name: Check that the generated scripts are up to date
        run: git diff --exit-code -- ../simulations/telescope-psf
