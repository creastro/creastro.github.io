<title>Tin Mai (Mai Như Tín) | Astronomer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: a rendered night sky (a star, the Milky Way and five real exoplanets, one of each kind) stays fixed behind six pages:
   Home, Education, Research, Simulations, My story, Contact. Page titles sit on the sky; content sits in cards.
   The sky is always night; the theme switches the cards, navigation and controls. */
:root{
  --hue:205; --sat:85%; --tint:28%; --r:16px; --pill:26px; --glass:.8; --blur:16px; --bw:1px; --shadow-a:.5;
  --maxw:1120px; --space:1; --lh:1.65; --ls:-.01em; --hw:700;
  --night:hsl(var(--hue) 45% 3%);
  --sky-fg:hsl(var(--hue) 30% 95%); --sky-muted:hsl(var(--hue) 16% 76%); --sky-line:hsl(var(--hue) 30% 70% / .3); --sky-accent:hsl(var(--hue) var(--sat) 72%);
  --fg:hsl(var(--hue) var(--tint) 12%); --muted:hsl(var(--hue) calc(var(--tint) * .5) 36%);
  --line:hsl(var(--hue) var(--tint) 62% / .55); --panel:hsl(var(--hue) var(--tint) 97% / var(--glass)); --solid:hsl(var(--hue) var(--tint) 97%);
  --accent:hsl(var(--hue) var(--sat) 32%); --on-accent:hsl(var(--hue) 40% 98%); --soft:hsl(var(--hue) var(--sat) 32% / .12);
  --display:"Unbounded","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --fg:hsl(var(--hue) var(--tint) 93%); --muted:hsl(var(--hue) calc(var(--tint) * .5) 70%);
  --line:hsl(var(--hue) var(--tint) 55% / .35); --panel:hsl(var(--hue) var(--tint) 8% / var(--glass)); --solid:hsl(var(--hue) var(--tint) 9%);
  --accent:hsl(var(--hue) var(--sat) 70%); --on-accent:hsl(var(--hue) 50% 7%); --soft:hsl(var(--hue) var(--sat) 70% / .14); color-scheme:dark } }
:root[data-theme="dark"]{
  --fg:hsl(var(--hue) var(--tint) 93%); --muted:hsl(var(--hue) calc(var(--tint) * .5) 70%);
  --line:hsl(var(--hue) var(--tint) 55% / .35); --panel:hsl(var(--hue) var(--tint) 8% / var(--glass)); --solid:hsl(var(--hue) var(--tint) 9%);
  --accent:hsl(var(--hue) var(--sat) 70%); --on-accent:hsl(var(--hue) 50% 7%); --soft:hsl(var(--hue) var(--sat) 70% / .14); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--night);color:var(--sky-fg);font:400 1rem/var(--lh) var(--body)}
a{color:var(--accent);text-underline-offset:3px}
:root[data-underline="off"] a{text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:var(--hw);letter-spacing:var(--ls);margin:0;text-wrap:balance}
:root[data-caps="on"] :is(h1,h2){text-transform:uppercase}
:root[data-headaccent="on"] :is(h2){color:var(--accent)}
p{margin:0}
.mono{font:500 .72rem/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.icon{width:1.1em;height:1.1em;flex:none}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:pan-y;background:radial-gradient(ellipse at 70% 30%,hsl(var(--hue) 50% 12%),var(--night) 70%)}
#tip{position:fixed;left:0;top:0;z-index:5;pointer-events:none;padding:6px 12px;border:var(--bw) solid var(--line);border-radius:var(--pill);background:var(--solid);color:var(--fg);white-space:nowrap}
/* text placed directly on the sky reads from the sky tokens */
.sky{--fg:var(--sky-fg);--muted:var(--sky-muted);--line:var(--sky-line);--accent:var(--sky-accent);color:var(--fg)}
.wrap{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 150px}
.wrap > *,.page > *{pointer-events:auto}.wrap > .page{pointer-events:none}

/* navigation */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;margin-block:14px calc(34px * var(--space));padding:10px 16px;color:var(--fg);border:var(--bw) solid var(--line);border-radius:var(--pill);background:var(--panel);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
.brand{display:flex;align-items:center;gap:10px;font:700 .86rem var(--display);color:var(--fg);text-decoration:none}
.brand img{width:34px;height:34px;object-fit:cover;border-radius:50%;border:2px solid var(--accent)}
.top nav{display:flex;flex-wrap:wrap;gap:2px}
.top nav a{padding:5px 12px;border-radius:var(--pill);color:var(--muted);text-decoration:none;font-size:.9rem;font-weight:500;border-bottom:2px solid transparent}
.top nav a:hover{color:var(--fg)}
.top nav a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
:root[data-nav="bar"] .top{border-radius:0;border-width:0 0 var(--bw);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
:root[data-nav="line"] .top{--fg:var(--sky-fg);--muted:var(--sky-muted);--accent:var(--sky-accent);background:none;border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;padding-inline:0}
:root[data-nav="line"] .top nav a[aria-current="page"]{background:none;color:var(--fg);border-radius:0;border-bottom-color:var(--accent)}

/* page head */
.page{display:grid;gap:calc(22px * var(--space))}
.t-fade{animation:pfade .5s ease both}.t-slide{animation:pslide .55s cubic-bezier(.2,.8,.2,1) both}.t-zoom{animation:pzoom .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes pfade{from{opacity:0}}@keyframes pslide{from{opacity:0;transform:translateY(26px)}}@keyframes pzoom{from{opacity:0;transform:scale(.96)}}
.head{max-width:760px;padding-block:calc(26px * var(--space)) calc(14px * var(--space))}
.head .mono{color:var(--accent)}
.head h1{font-size:clamp(2.1rem,5.6vw,4.4rem);line-height:1.04;margin-block:14px 18px}
.head h1 em{font-style:normal;color:var(--accent)}
.head h1 .w{display:inline-block;margin-right:.26em}
.a-rise .w{animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards}.a-blur .w{animation:blurin 1.1s ease-out backwards}.a-swing .w{animation:swing 1.2s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{transform:translateY(.6em);opacity:0}}@keyframes blurin{from{filter:blur(14px);opacity:0}}@keyframes swing{from{transform:translateX(-1.2em) rotate(-14deg) scale(.6);opacity:0}}
.lede{font-size:1.1rem;color:var(--muted);max-width:60ch}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:calc(24px * var(--space))}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border:var(--bw) solid var(--accent);border-radius:var(--pill);background:var(--accent);color:var(--on-accent);font:600 .92rem var(--body);text-decoration:none!important;cursor:pointer;transition:transform .2s,filter .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
:root[data-btn="outline"] .btn:not(.ghost){background:transparent;color:var(--accent)}
:root[data-btn="soft"] .btn:not(.ghost){background:var(--soft);color:var(--accent);border-color:transparent}
.cities{margin-top:22px;color:var(--muted)}
.hint{display:flex;gap:10px;align-items:flex-start;margin-top:16px;color:var(--muted);font-size:.88rem;max-width:56ch}
.hint .icon{color:var(--accent);margin-top:.25em}
.spacer{height:22svh;pointer-events:none!important}
.sky :is(h1,h2,p,span,time){text-shadow:0 1px 18px hsl(var(--hue) 60% 3% / .9)}

/* cards */
.card{padding:calc(26px * var(--space)) clamp(18px,3vw,30px);color:var(--fg);border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--panel);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));box-shadow:0 22px 60px -30px hsl(var(--hue) 60% 2% / var(--shadow-a));min-width:0}
:root[data-card="solid"] .card{background:var(--solid);backdrop-filter:none;-webkit-backdrop-filter:none}
:root[data-card="outline"] .card,:root[data-card="bare"] .card{--fg:var(--sky-fg);--muted:var(--sky-muted);--line:var(--sky-line);--accent:var(--sky-accent);--soft:hsl(var(--hue) var(--sat) 70% / .16);background:hsl(var(--hue) 45% 4% / .35);box-shadow:none}
:root[data-card="bare"] .card{border-color:transparent;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding-inline:0}
.card h2{font-size:clamp(1.2rem,2.3vw,1.6rem);line-height:1.18}
.card h3{font:600 1.08rem/1.3 var(--body);letter-spacing:0;text-transform:none}
.card .mono{color:var(--accent)}
.card p{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:calc(18px * var(--space))}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(18px * var(--space))}
.stack{display:grid;gap:10px;align-content:start}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:calc(26px * var(--space))}
.sec h2{font-size:clamp(1.4rem,3vw,2rem)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list li{padding-left:18px;position:relative;color:var(--muted)}
.list li::before{content:"";position:absolute;left:0;top:.7em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
figure{margin:0}
.pic{display:block;width:100%;height:auto;border-radius:calc(var(--r) * .7);border:var(--bw) solid var(--line);background:var(--solid)}
:root[data-img="mono"] .pic{filter:grayscale(1) contrast(1.05)}
:root[data-img="tint"] .pic{filter:grayscale(1) sepia(1) hue-rotate(calc(var(--hue) * 1deg - 40deg)) saturate(1.6)}
figcaption{margin-top:8px;font-size:.84rem;color:var(--muted)}
.exp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:calc(26px * var(--space));align-items:center}
.exp .org{font-weight:600;color:var(--fg);margin-block:6px 10px}
.exp small,.card small{display:block;margin-top:10px;font-size:.86rem;color:var(--muted)}
.tl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px}
.tl time{color:var(--accent);padding-top:calc(28px * var(--space))}
.simcard{display:grid;gap:12px;align-content:start;text-decoration:none!important;transition:transform .25s,border-color .25s}
.simcard:hover{transform:translateY(-4px);border-color:var(--accent)}
.simcard .more{color:var(--accent);font-weight:600}
.level{display:inline-block;padding:2px 10px;border:var(--bw) solid var(--line);border-radius:var(--pill);font-size:.8rem;color:var(--muted);justify-self:start}
.linkrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border:var(--bw) solid var(--line);border-radius:calc(var(--r) * .7);color:var(--fg);text-decoration:none!important;font-weight:600;transition:border-color .2s,transform .2s}
.linkrow:hover{border-color:var(--accent);transform:translateX(4px)}
footer{margin-top:calc(30px * var(--space));color:var(--muted);font-size:.84rem}


@media (prefers-reduced-motion:reduce){.head h1 .w,.page{animation:none!important}*{transition:none!important}}
@media (max-width:860px){
  .grid2,.grid3,.exp{grid-template-columns:1fr}.tl{grid-template-columns:1fr;gap:6px}.tl time{padding-top:0}
  .top{border-radius:min(var(--pill),20px);position:static}.spacer{height:34svh}
}
</style>

</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="tip" class="mono" hidden></div>
<div id="root"></div>

<script id="fragbg" type="x-shader/x-fragment">
precision highp float;
uniform vec2 u_res, u_tres, u_cov; uniform vec3 u_acc; uniform float u_neb, u_dens, u_mw, u_has, u_k; uniform mat3 u_cam; uniform sampler2D u_pano;
float hash(vec3 p){ p = fract(p * .3183099 + .1); p *= 17.; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float noise(vec3 x){ vec3 i = floor(x), f = fract(x); f = f * f * (3. - 2. * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x), mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x), mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z); }
float fbm(vec3 p){ float a = .5, s = 0.; for (int i = 0; i < 6; i++) { s += a * noise(p); p = p * 2.03 + vec3(1.7, 9.2, 3.1); a *= .5; } return s; }
float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }

// star colours from cool orange to hot blue-white; most stars sit near white
vec3 starCol(float t){ return t < .45 ? mix(vec3(1., .66, .42), vec3(1., .95, .86), t / .45) : mix(vec3(1., .95, .86), vec3(.7, .8, 1.), (t - .45) / .55); }
// one layer of point sources: a jittered grid, brightness on a steep power law (many faint, few bright),
// each star a Gaussian of `sig` pixels plus an optional faint halo
vec3 stars(vec2 p, float sc, float prob, float iMin, float iMax, float sig, float halo){
  vec2 g = p * sc, id = floor(g), f = fract(g) - .5; float h = h21(id);
  if (h > prob) return vec3(0.);
  vec2 o = (vec2(h21(id + 3.1), h21(id + 7.7)) - .5) * .7;
  float m = h21(id + 11.3), I = iMin * pow(iMax / iMin, m * m * m);
  float dpx = length(f - o) / sc * u_res.y;
  return starCol(h21(id + 5.5)) * I * (exp(-dpx * dpx / (2. * sig * sig)) + halo / (1. + dpx * dpx));
}

void main(){
  vec2 p = (gl_FragCoord.xy - .5 * u_tres) / u_res.y; float a = u_res.x / u_res.y;
  if (u_has > .5) {
    // The real sky: ESO's Milky Way panorama (S. Brunier), an equirectangular map in galactic coordinates.
    // Each pixel's line of sight is turned into galactic longitude and latitude and looked up in the photograph.
    vec3 dir = normalize(u_cam * vec3(p, u_k));
    float l = atan(dir.y, dir.x), b = asin(clamp(dir.z, -1., 1.));
    vec3 ph = texture2D(u_pano, vec2(.5 - l / (2. * u_cov.x), .5 + b / (2. * u_cov.y))).rgb;
    ph *= smoothstep(u_cov.x, u_cov.x - .08, abs(l)) * smoothstep(u_cov.y, u_cov.y - .08, abs(b));
    ph = min(pow(ph, vec3(1.18)) * u_mw * 1.05, vec3(.985));
    vec3 sky = -log(1. - pow(ph, vec3(1. / .92))) / 1.5; // inverse of the final display curve, so the photograph keeps its tones
    vec2 nq = p * 1.7; float m2 = fbm(vec3(nq + 5., 2.)), m3 = 1. - abs(2. * fbm(vec3(nq * 2.2 + 1., 6.)) - 1.);
    sky += u_acc * pow(m2, 3.4) * (.35 + .65 * m3) * u_neb;
    sky += (stars(p, 230., u_dens * .6, .025, .5, .62, 0.) + stars(p + 3.7, 95., u_dens * .45, .1, 1.8, .72, 0.) + stars(p - 1.3, 34., u_dens * .35, .45, 5., .85, .012));
    sky += (h21(gl_FragCoord.xy) - .5) / 255.;
    gl_FragColor = vec4(sqrt(clamp(sky, 0., 3.) / 3.), 1.);
    return;
  }
  vec3 col = vec3(.0025, .003, .006); // fallback while the photograph loads, or if it cannot be loaded

  // galactic frame: lon runs along the plane, lat across it; the centre of the Galaxy sits a little right of the middle
  vec2 q = p - vec2(.07 * a, .05); const float th = .6;
  vec2 g = vec2(cos(th) * q.x + sin(th) * q.y, -sin(th) * q.x + cos(th) * q.y);
  vec2 w1 = vec2(fbm(vec3(g * vec2(2., 4.), 1.)), fbm(vec3(g * vec2(2., 4.) + 7.3, 2.))) - .5;
  float lon = g.x + .06 * w1.x, lat = g.y + .05 * w1.y;

  // starlight: an exponential disk that thickens into the bulge, mottled by star clouds
  float hs = .05 + .045 * exp(-lon * lon * 4.5);
  float disk = exp(-abs(lat) / hs) * (.42 + .58 * exp(-abs(lon) * 1.1));
  float bul = exp(-pow(lon * lon / .03 + lat * lat / .0085, .72));
  float cl = fbm(vec3(vec2(lon, lat) * vec2(3.2, 6.5), 3.));
  float light = disk * (.45 + 1.7 * cl * cl) + bul * .9 + .1 * exp(-abs(lat) / (hs * 2.6)) * (.4 + .6 * exp(-abs(lon) * 1.1));

  // dust: a thin, clumpy layer in the mid-plane (the Great Rift) with filaments reaching out of it.
  // Extinction is stronger in blue than in red, so what shines through the dust is reddened.
  vec2 dq = vec2(lon, lat) * vec2(4.2, 9.5) + w1 * 1.6;
  float d1 = fbm(vec3(dq, 5.)), d2 = fbm(vec3(dq * 2.6 + 11., 8.)), ridge = 1. - abs(2. * d2 - 1.);
  float layer = exp(-abs(lat + .007) / (hs * .34));
  float tau = 2.6 * layer * smoothstep(.4, .66, d1 * .78 + ridge * .28 + .26 * layer - .13)
            + 1.3 * exp(-abs(lat) / (hs * 1.5)) * smoothstep(.56, .8, d1 * ridge * 1.9);
  vec3 ext = exp(-tau * vec3(.8, 1., 1.28));

  vec3 tint = mix(vec3(.64, .73, 1.), vec3(1., .85, .64), clamp(bul * 1.7 + disk * .4, 0., 1.));
  float grain = .86 + .5 * noise(vec3(p * u_res.y * .55, 1.)) * noise(vec3(p * u_res.y * .13, 4.)); // unresolved stars
  col += tint * light * grain * ext * u_mw * .7;
  // ionised hydrogen regions: small pink knots hugging the plane
  col += vec3(1., .24, .36) * pow(noise(vec3(g * 34., 9.)), 26.) * exp(-abs(lat) / (hs * .5)) * exp(-tau * .3) * u_mw * 3.;
  // faint emission wisps in the accent colour
  vec2 nq = p * 1.7 + w1 * .9; float n2 = fbm(vec3(nq + 5., 2.)), n3 = 1. - abs(2. * fbm(vec3(nq * 2.2 + 1., 6.)) - 1.);
  col += u_acc * pow(n2, 3.4) * (.35 + .65 * n3) * u_neb;

  // a distant spiral galaxy seen at an angle
  vec2 s = p - vec2(-.06 * a, -.37); s = vec2(.86 * s.x + .5 * s.y, -.5 * s.x + .86 * s.y);
  float gr = sqrt(s.x * s.x / .0009 + s.y * s.y / .00009);
  col += vec3(.95, .88, .8) * (.5 * exp(-gr * 3.2) + .08 * exp(-gr * .9));

  // resolved stars: far more of them toward the plane, dimmed and reddened where dust lies in front
  float plane = exp(-abs(lat) / (hs * 2.4)), dn = u_dens * (.3 + .7 * plane);
  vec3 st = stars(p, 230., dn * .8, .025, .5, .62, 0.) + stars(p + 3.7, 95., dn * .62, .1, 1.8, .72, 0.)
          + stars(p - 1.3, 34., dn * .5, .45, 5., .85, .012) + stars(p + 9.1, 7.5, dn * .55, 2.5, 14., 1.05, .03);
  st += stars(p + 5.5, 430., plane * .85, .015, .22, .6, 0.) * u_mw;
  col += st * mix(vec3(1.), ext, .88);

  col += (h21(gl_FragCoord.xy) - .5) / 255.;
  gl_FragColor = vec4(sqrt(clamp(col, 0., 3.) / 3.), 1.); // square-root encoded so dark gradients survive 8 bits
}
</script>

<script id="frag" type="x-shader/x-fragment">
precision highp float;
uniform vec2 u_res, u_tres, u_par, u_star; uniform sampler2D u_bg;
uniform float u_time, u_starB, u_clouds, u_atmo, u_expo, u_twk;
